name: Update data

on:
  schedule:
    - cron: "30 7 * * *"   # 10:30 Kyiv (summer) — after the General Staff morning report
    - cron: "30 13 * * *"  # retry later in the day in case the feed was late
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/losses.json data/fx.json data/history.json
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git push
